$schema: 'https://moonrepo.dev/schemas/project.json'
project:
  name: 'web'
  description: 'Bilingual React podcast library and player'
tags: ['react']
tasks:
  dev:
    command: 'pnpm dev'
    options:
      persistent: true
  check:
    command: 'pnpm check'
  test:
    command: 'pnpm test'
  build:
    command: 'pnpm build'
    outputs: ['dist']
