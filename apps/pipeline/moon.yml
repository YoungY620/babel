$schema: 'https://moonrepo.dev/schemas/project.json'
project:
  name: 'pipeline'
  description: 'Ubuntu CPU 音频转换、RSS 与发布流水线'
tags: ['python']
tasks:
  setup:
    command: 'bash ../../scripts/setup_pipeline.sh'
    options:
      cache: false
  check:
    command: 'python3 -m compileall -q pipeline'
    options:
      cache: false
  convert:
    command: './.venv/bin/python pipeline/convert.py'
    options:
      cache: false
  feed:
    command: './.venv/bin/python pipeline/build_feed.py'
    options:
      cache: false
  publish:
    command: 'bash pipeline/publish.sh'
    options:
      cache: false
