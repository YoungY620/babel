name: seal model credential for private runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-nacl
      - run: /usr/bin/python3 scripts/seal_credentials.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-model-credential
          path: sealed-credential.json
          retention-days: 1
          if-no-files-found: error
