name: convert

# 每周转换：周二 12:00（北京时间）首次尝试；
# 失败（如本机 runner 不在线）→ 当天 17:00 重试 → 之后每天 12:00/17:00 重试，
# 直到成功（state.json 记录本周已完成，后续触发自动跳过）。
# 每周期处理全部未上线单集（最新优先），联合上限：仅当同时 >8h 且 >5 集才截断。
# 断点续跑：转录/TTS/翻译逐块落盘，中断后重跑从断点继续（见 DECISIONS.md D4）。
# cron 为 UTC：04:07 ≈ 北京 12:07，09:07 ≈ 北京 17:07。

on:
  schedule:
    - cron: '7 4,9 * * 0,2,3,4,5,6'
  workflow_dispatch:
    inputs:
      smoke:
        description: '仅验证 Ubuntu runner，不转换或发布'
        type: boolean
        default: false
      video_url:
        description: '视频/音频页 URL（优先，绕过周门控）'
        required: false
      rss_index:
        description: 'RSS 单集序号（绕过周门控）'
        required: false

permissions:
  contents: write

concurrency:        # 防重入：同一时刻只允许一个周期在跑，后来的排队
  group: convert
  cancel-in-progress: false

jobs:
  convert:
    if: inputs.smoke != true
    runs-on: [self-hosted, Linux, X64, babel]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONVERT_WORKERS: "1"
      TRANSCRIBE_JOBS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false    # 保留工作区里的下载/venv/断点产物，跨 run 续跑

      - name: privacy check
        run: bash scripts/privacy_check.sh

      - name: weekly gate
        id: gate
        working-directory: apps/pipeline
        run: |
          WEEK=$(date -u +%G-W%V)
          LAST=$(python3 -c "import json;print(json.load(open('state.json')).get('last_week',''))" 2>/dev/null || true)
          echo "week=$WEEK last=$LAST"
          if [ "$LAST" = "$WEEK" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: ensure venv
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        run: pnpm moon run pipeline:setup

      - name: convert
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        working-directory: apps/pipeline
        run: |
          if [ -n "${{ inputs.video_url }}" ]; then
            .venv/bin/python pipeline/convert.py --url "${{ inputs.video_url }}"
          elif [ -n "${{ inputs.rss_index }}" ]; then
            .venv/bin/python pipeline/convert.py --index "${{ inputs.rss_index }}"
          else
            .venv/bin/python pipeline/convert.py --cycle
          fi

      - name: mark week done
        if: github.event_name == 'schedule' && success()
        working-directory: apps/pipeline
        run: |
          python3 -c "import json,os;json.dump({'last_week':os.popen('date -u +%G-W%V').read().strip()},open('state.json','w'))"

      - name: publish
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        working-directory: apps/pipeline
        run: bash pipeline/publish.sh

  runner-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke == true
    runs-on: [self-hosted, Linux, X64, babel]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm moon run root:privacy pipeline:check pipeline:test
      - name: Verify isolation
        shell: bash
        run: |
          test "$(id -un)" = babel-runner
          test "$(uname -m)" = x86_64
          test ! -r /etc/rancher/k3s/k3s.yaml
          test ! -w /var/run/docker.sock
          python3.12 --version
          ffmpeg -version | head -1
