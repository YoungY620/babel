name: convert

# Bootstrap is manual only. Daily scheduling is enabled after quality and capacity validation.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: '仅验证 Ubuntu runner，不转换或发布'
        type: boolean
        default: false
      video_url:
        description: '视频/音频页 URL（优先，绕过周门控）'
        required: false
      rss_index:
        description: 'RSS 单集序号（绕过周门控）'
        required: false
      publish:
        description: '仅运行新发布事务（stage → audio release → publication 分支 → Pages）'
        type: boolean
        default: false

env:
  BABEL_DATA_DIR: /srv/babel/data

permissions:
  contents: write

concurrency:        # 防重入：同一时刻只允许一个周期在跑，后来的排队
  group: convert
  cancel-in-progress: false

jobs:
  convert:
    if: inputs.smoke != true && inputs.publish != true
    runs-on: [self-hosted, Linux, X64, babel]
    env:
      CONVERT_WORKERS: "1"
      TRANSCRIBE_JOBS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YoungY620/babel
          ref: main
          persist-credentials: false
          clean: false    # Archive pre-upgrade state once before enabling source cleanup.

      - run: bash scripts/configure_pipeline.sh YoungY620/babel

      - name: privacy check
        run: bash scripts/privacy_check.sh

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - name: Install Python
        run: |
          uv python install 3.12
          echo "$(dirname "$(uv python find 3.12)")" >> "$GITHUB_PATH"

      - name: weekly gate
        id: gate
        working-directory: apps/pipeline
        run: |
          WEEK=$(date -u +%G-W%V)
          LAST=$(python3 -c "import json;print(json.load(open('state.json')).get('last_week',''))" 2>/dev/null || true)
          echo "week=$WEEK last=$LAST"
          if [ "$LAST" = "$WEEK" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - run: pnpm install --frozen-lockfile
      - name: ensure venv
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        run: pnpm moon run pipeline:setup

      - name: convert
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        working-directory: apps/pipeline
        run: |
          if [ -n "${{ inputs.video_url }}" ]; then
            .venv/bin/python pipeline/convert.py --url "${{ inputs.video_url }}"
          elif [ -n "${{ inputs.rss_index }}" ]; then
            .venv/bin/python pipeline/convert.py --index "${{ inputs.rss_index }}"
          else
            .venv/bin/python pipeline/convert.py --cycle
          fi

      - name: mark week done
        if: github.event_name == 'schedule' && success()
        working-directory: apps/pipeline
        run: |
          python3 -c "import json,os;json.dump({'last_week':os.popen('date -u +%G-W%V').read().strip()},open('state.json','w'))"

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.BABEL_PUBLISH_TOKEN }}
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        working-directory: apps/pipeline
        run: |
          gh auth setup-git
          bash pipeline/publish.sh

  publish:
    # New publisher transaction, manual only. The legacy convert/publish path above is
    # untouched; cron scheduling arrives after capacity validation in a follow-up PR.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.smoke != true
    name: publish transaction
    runs-on: [self-hosted, Linux, X64, babel]
    timeout-minutes: 90
    env:
      PUBLISH_REPO: YoungY620/babel
      GH_TOKEN: ${{ secrets.BABEL_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YoungY620/babel
          ref: main
          persist-credentials: false
          clean: false    # Archive pre-upgrade state once before enabling source cleanup.

      - run: bash scripts/privacy_check.sh

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - name: Install Python
        run: |
          uv python install 3.12
          echo "$(dirname "$(uv python find 3.12)")" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - name: preflight
        working-directory: apps/pipeline
        run: |
          start=$SECONDS
          fail() { python3.12 pipeline/publish_transaction.py log --step preflight --fail --seconds $((SECONDS - start)); exit 1; }
          trap fail ERR
          [ -n "${GH_TOKEN:-}" ] || fail    # BABEL_PUBLISH_TOKEN arrives as GH_TOKEN; never echo it.
          command -v gh >/dev/null || fail
          gh auth status
          gh auth setup-git   # git pushes below authenticate through this helper, not an embedded URL.
          python3.12 pipeline/publish_transaction.py log --step preflight --seconds $((SECONDS - start))

      - name: stage verified assets
        run: |
          start=$SECONDS
          fail() { python3.12 apps/pipeline/pipeline/publish_transaction.py log --step stage --fail --seconds $((SECONDS - start)); exit 1; }
          trap fail ERR
          pnpm moon run pipeline:assets -- --output "$RUNNER_TEMP/babel-assets"
          staged=$(python3.12 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["assets"]))' \
            "$RUNNER_TEMP/babel-assets/manifest.json")
          python3.12 apps/pipeline/pipeline/publish_transaction.py log --step stage \
            --seconds $((SECONDS - start)) --count staged="$staged"

      - name: plan uploads from the durable ledger
        run: |
          mkdir -p "$RUNNER_TEMP/babel-ledger"
          if gh release view audio --repo "$PUBLISH_REPO" >/dev/null 2>&1; then
            gh release download audio --repo "$PUBLISH_REPO" -p ledger.json \
              --dir "$RUNNER_TEMP/babel-ledger" \
              || echo "ledger.json absent on the release; starting from an empty ledger"
          fi
          python3.12 apps/pipeline/pipeline/publish_transaction.py plan \
            --ledger "$RUNNER_TEMP/babel-ledger/ledger.json" \
            --staging "$RUNNER_TEMP/babel-assets" \
            --out "$RUNNER_TEMP/babel-plan.json"

      - name: resolve publication branch
        id: resolve
        env:
          GITHUB_REPOSITORY: YoungY620/babel
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/.publication-input"
          revision=$(bash scripts/resolve_publication.sh)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.resolve.outputs.revision != ''
        with:
          repository: YoungY620/babel
          ref: ${{ steps.resolve.outputs.revision }}
          path: .publication-input
          persist-credentials: false

      - name: build publication snapshot
        run: |
          start=$SECONDS
          fail() { python3.12 apps/pipeline/pipeline/publish_transaction.py log --step snapshot --fail --seconds $((SECONDS - start)); exit 1; }
          trap fail ERR
          args=(--output "$RUNNER_TEMP/babel-snapshot" \
            --site-url https://youngy620.github.io/babel \
            --audio-base "https://github.com/$PUBLISH_REPO/releases/download/audio")
          if [ -n "${{ steps.resolve.outputs.revision }}" ]; then
            args+=(--previous "$GITHUB_WORKSPACE/.publication-input")
          fi
          pnpm moon run pipeline:publication -- "${args[@]}"
          python3.12 apps/pipeline/pipeline/publish_transaction.py log --step snapshot --seconds $((SECONDS - start))

      - name: check whether anything needs publishing
        id: snapcheck
        run: |
          if ! curl -fsS --max-time 30 -o "$RUNNER_TEMP/babel-live-receipt.json" \
              https://youngy620.github.io/babel/publication.json; then
            rm -f "$RUNNER_TEMP/babel-live-receipt.json"   # no deployment yet: publish
          fi
          python3.12 apps/pipeline/pipeline/publish_transaction.py snapshot-check \
            --plan "$RUNNER_TEMP/babel-plan.json" \
            --catalog "$RUNNER_TEMP/babel-snapshot/catalog.json" \
            --receipt "$RUNNER_TEMP/babel-live-receipt.json" \
            --out "$GITHUB_OUTPUT"

      - name: upload new assets to the audio release
        if: steps.snapcheck.outputs.changed != 'false'
        run: |
          start=$SECONDS
          fail() { python3.12 apps/pipeline/pipeline/publish_transaction.py log --step upload --fail --seconds $((SECONDS - start)); exit 1; }
          trap fail ERR
          if ! gh release view audio --repo "$PUBLISH_REPO" >/dev/null 2>&1; then
            gh release create audio --repo "$PUBLISH_REPO" --title "Audio assets" \
              --notes "Verified episode audio and the durable publication ledger."
          fi
          python3.12 - "$RUNNER_TEMP/babel-assets" "$RUNNER_TEMP/babel-plan.json" \
              > "$RUNNER_TEMP/babel-upload-files" <<'PY'
          import json, sys
          staging, plan = sys.argv[1], json.load(open(sys.argv[2]))
          manifest = json.load(open(staging + "/manifest.json"))
          for episode in plan["new"]:
              print(staging + "/" + manifest["assets"][episode]["file"])
          PY
          mapfile -t files < "$RUNNER_TEMP/babel-upload-files"
          if [ "${#files[@]}" -gt 0 ]; then
            # Content-addressed names make --clobber a no-op for identical bytes, so a
            # rerun after a crashed ledger write is safe.
            gh release upload audio --repo "$PUBLISH_REPO" --clobber "${files[@]}"
          fi
          gh release view audio --repo "$PUBLISH_REPO" --json assets \
            > "$RUNNER_TEMP/babel-release-assets.json"
          python3.12 apps/pipeline/pipeline/publish_transaction.py check-upload \
            --staging "$RUNNER_TEMP/babel-assets" \
            --assets "$RUNNER_TEMP/babel-release-assets.json"
          python3.12 apps/pipeline/pipeline/publish_transaction.py log --step upload \
            --seconds $((SECONDS - start)) --count uploaded="${#files[@]}"

      - name: push publication branch
        id: push
        if: steps.snapcheck.outputs.changed != 'false'
        env:
          PREVIOUS_REVISION: ${{ steps.resolve.outputs.revision }}
        run: |
          start=$SECONDS
          fail() { python3.12 apps/pipeline/pipeline/publish_transaction.py log --step push --fail --seconds $((SECONDS - start)); exit 1; }
          trap fail ERR
          repo_dir="$RUNNER_TEMP/babel-publication-git"
          git init -b publication "$repo_dir"
          cd "$repo_dir"
          git remote add origin "https://github.com/$PUBLISH_REPO.git"
          if [ -n "$PREVIOUS_REVISION" ]; then
            git fetch --depth 1 origin publication
            git reset --hard FETCH_HEAD   # new commit lands on the branch tip: fast-forward push
          fi
          cp -R "$RUNNER_TEMP/babel-snapshot/." .
          git add -A
          # The commit cannot embed its own SHA; the receipt carries the data revision.
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "publication: control-plane run $GITHUB_RUN_ID" \
            -m "Previous data revision: ${PREVIOUS_REVISION:-none}"
          revision=$(git rev-parse HEAD)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git push origin publication
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          python3.12 apps/pipeline/pipeline/publish_transaction.py log --step push --seconds $((SECONDS - start))

      - name: dispatch Pages for the new data revision
        id: pages
        if: steps.snapcheck.outputs.changed != 'false'
        env:
          PUBLISHED_REVISION: ${{ steps.push.outputs.revision }}
        run: |
          start=$SECONDS
          fail() { python3.12 apps/pipeline/pipeline/publish_transaction.py log --step dispatch --fail --seconds $((SECONDS - start)); exit 1; }
          trap fail ERR
          gh workflow run pages.yml --repo "$PUBLISH_REPO" -f "publication_revision=$PUBLISHED_REVISION"
          cutoff=$(date -u -d '2 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          run_id=""
          for _ in $(seq 1 12); do
            if gh run list --repo "$PUBLISH_REPO" --workflow pages.yml --event workflow_dispatch \
                --json databaseId,createdAt > "$RUNNER_TEMP/babel-pages-runs.json" 2>/dev/null; then
              run_id=$(python3.12 - "$cutoff" "$RUNNER_TEMP/babel-pages-runs.json" <<'PY'
          import json, sys
          cutoff, runs = sys.argv[1], json.load(open(sys.argv[2]))
          fresh = [run for run in runs if run["createdAt"] >= cutoff]
          print(fresh[0]["databaseId"] if fresh else "")
          PY
          )
            fi
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || fail
          state=""
          for _ in $(seq 1 60); do
            state=$(gh run view "$run_id" --repo "$PUBLISH_REPO" --json status,conclusion \
              --jq '.status + " " + (.conclusion // "pending")' || true)
            [ "$state" = "completed success" ] && break
            if [ -n "$state" ]; then
              case "$state" in completed*) fail;; esac
            fi
            sleep 10
          done
          [ "$state" = "completed success" ] || fail
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          python3.12 apps/pipeline/pipeline/publish_transaction.py log --step dispatch \
            --seconds $((SECONDS - start)) --count runId="$run_id"

      - name: verify the publication receipt
        if: steps.snapcheck.outputs.changed != 'false'
        env:
          PUBLISHED_REVISION: ${{ steps.push.outputs.revision }}
          PAGES_RUN_ID: ${{ steps.pages.outputs.run-id }}
        run: |
          receipt="$RUNNER_TEMP/babel-receipt.json"
          fetched=""
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 30 -o "$receipt" \
                https://youngy620.github.io/babel/publication.json; then
              fetched=1
              break
            fi
            sleep 5
          done
          if [ -z "$fetched" ]; then
            python3.12 apps/pipeline/pipeline/publish_transaction.py log --step receipt-fetch --fail
            exit 1
          fi
          python3.12 apps/pipeline/pipeline/publish_transaction.py check-receipt \
            --receipt "$receipt" \
            --catalog "$RUNNER_TEMP/babel-snapshot/catalog.json" \
            --revision "$PUBLISHED_REVISION" --run-id "$PAGES_RUN_ID"

      - name: advance the durable ledger
        if: steps.snapcheck.outputs.changed != 'false'
        run: |
          start=$SECONDS
          fail() { python3.12 apps/pipeline/pipeline/publish_transaction.py log --step ledger-store --fail --seconds $((SECONDS - start)); exit 1; }
          trap fail ERR
          python3.12 apps/pipeline/pipeline/publish_transaction.py advance \
            --ledger "$RUNNER_TEMP/babel-ledger/ledger.json" \
            --staging "$RUNNER_TEMP/babel-assets" \
            --receipt "$RUNNER_TEMP/babel-receipt.json" \
            --catalog "$RUNNER_TEMP/babel-snapshot/catalog.json" \
            --out "$RUNNER_TEMP/babel-ledger-next/ledger.json"
          gh release upload audio --repo "$PUBLISH_REPO" \
            "$RUNNER_TEMP/babel-ledger-next/ledger.json" --clobber
          python3.12 apps/pipeline/pipeline/publish_transaction.py log --step ledger-store \
            --seconds $((SECONDS - start))

      - name: nothing to publish
        if: steps.snapcheck.outputs.changed == 'false'
        run: |
          python3.12 apps/pipeline/pipeline/publish_transaction.py log \
            --step nothing-to-publish --seconds 0 --count changed=0

  runner-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke == true
    runs-on: [self-hosted, Linux, X64, babel]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YoungY620/babel
          ref: main
          clean: false
          persist-credentials: false
      - run: bash scripts/configure_pipeline.sh YoungY620/babel
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - name: Install Python
        run: |
          uv python install 3.12
          echo "$(dirname "$(uv python find 3.12)")" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm moon run root:privacy pipeline:check pipeline:test
      - name: Verify isolation
        shell: bash
        run: |
          test "$(id -un)" = babel-runner
          test "$(uname -m)" = x86_64
          test ! -r /etc/rancher/k3s/k3s.yaml
          test ! -w /var/run/docker.sock
          python3.12 --version
          gh --version
          git var GIT_AUTHOR_IDENT
          python3.12 -c 'import sys; sys.path.insert(0,"apps/pipeline/pipeline"); from build_feed import load_config; cfg=load_config(); assert cfg["GITHUB_USER"] and cfg["GITHUB_REPO"]'
          ffmpeg -version | head -1
