name: convert

# Bootstrap is manual only. Daily scheduling is enabled after quality and capacity validation.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: '仅验证 Ubuntu runner，不转换或发布'
        type: boolean
        default: false
      video_url:
        description: '视频/音频页 URL（优先，绕过周门控）'
        required: false
      rss_index:
        description: 'RSS 单集序号（绕过周门控）'
        required: false

env:
  BABEL_DATA_DIR: /srv/babel/data

permissions:
  contents: write

concurrency:        # 防重入：同一时刻只允许一个周期在跑，后来的排队
  group: convert
  cancel-in-progress: false

jobs:
  convert:
    if: inputs.smoke != true
    runs-on: [self-hosted, Linux, X64, babel]
    env:
      CONVERT_WORKERS: "1"
      TRANSCRIBE_JOBS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YoungY620/babel
          ref: main
          persist-credentials: false
          clean: false    # Archive pre-upgrade state once before enabling source cleanup.

      - run: bash scripts/configure_pipeline.sh YoungY620/babel

      - name: privacy check
        run: bash scripts/privacy_check.sh

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - name: Install Python
        run: |
          uv python install 3.12
          echo "$(dirname "$(uv python find 3.12)")" >> "$GITHUB_PATH"

      - name: weekly gate
        id: gate
        working-directory: apps/pipeline
        run: |
          WEEK=$(date -u +%G-W%V)
          LAST=$(python3 -c "import json;print(json.load(open('state.json')).get('last_week',''))" 2>/dev/null || true)
          echo "week=$WEEK last=$LAST"
          if [ "$LAST" = "$WEEK" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - run: pnpm install --frozen-lockfile
      - name: ensure venv
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        run: pnpm moon run pipeline:setup

      - name: convert
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        working-directory: apps/pipeline
        run: |
          if [ -n "${{ inputs.video_url }}" ]; then
            .venv/bin/python pipeline/convert.py --url "${{ inputs.video_url }}"
          elif [ -n "${{ inputs.rss_index }}" ]; then
            .venv/bin/python pipeline/convert.py --index "${{ inputs.rss_index }}"
          else
            .venv/bin/python pipeline/convert.py --cycle
          fi

      - name: mark week done
        if: github.event_name == 'schedule' && success()
        working-directory: apps/pipeline
        run: |
          python3 -c "import json,os;json.dump({'last_week':os.popen('date -u +%G-W%V').read().strip()},open('state.json','w'))"

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.BABEL_PUBLISH_TOKEN }}
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true'
        working-directory: apps/pipeline
        run: |
          gh auth setup-git
          bash pipeline/publish.sh

  runner-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke == true
    runs-on: [self-hosted, Linux, X64, babel]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YoungY620/babel
          ref: main
          clean: false
          persist-credentials: false
      - run: bash scripts/configure_pipeline.sh YoungY620/babel
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - name: Install Python
        run: |
          uv python install 3.12
          echo "$(dirname "$(uv python find 3.12)")" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm moon run root:privacy pipeline:check pipeline:test
      - name: Verify isolation
        shell: bash
        run: |
          test "$(id -un)" = babel-runner
          test "$(uname -m)" = x86_64
          test ! -r /etc/rancher/k3s/k3s.yaml
          test ! -w /var/run/docker.sock
          python3.12 --version
          gh --version
          git var GIT_AUTHOR_IDENT
          python3.12 -c 'import sys; sys.path.insert(0,"apps/pipeline/pipeline"); from build_feed import load_config; cfg=load_config(); assert cfg["GITHUB_USER"] and cfg["GITHUB_REPO"]'
          ffmpeg -version | head -1
