name: evaluate speech presets
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact public Babel commit SHA to evaluate'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: convert
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'YoungY620/babel-runner'
    runs-on: [self-hosted, Linux, X64, babel]
    timeout-minutes: 30
    steps:
      - name: Validate revision
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YoungY620/babel
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install Python
        run: |
          uv python install 3.12
          echo "$(dirname "$(uv python find 3.12)")" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm moon run root:privacy pipeline:check pipeline:test
      - name: Evaluate original speech test cases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm moon run pipeline:evaluate -- --output "$RUNNER_TEMP/babel-speech-evaluation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speech-evaluation
          path: ${{ runner.temp }}/babel-speech-evaluation
          include-hidden-files: true
          retention-days: 3
